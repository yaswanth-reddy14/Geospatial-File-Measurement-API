name: Validate API

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: python scripts/smoke_test.py --regressions
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: geospatial-ci
      API_PORT: "18001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install smoke-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Build without cached layers
        run: docker compose build --no-cache
      - name: Start and wait for healthy API
        run: docker compose up -d --wait --wait-timeout 60
      - name: Exercise container API and audit regressions
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:18001 --regressions
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove disposable containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
